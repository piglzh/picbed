<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的图片画廊</title>
    <link rel="stylesheet" href="https://unpkg.com/litelight-js@latest/dist/lite-light.min.css">
    <style>
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 20px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; border-radius: 8px; }
    </style>
</head>
<body>
    <!-- 保持为空，由 JS 动态填充 -->
    <div class="gallery" id="gallery-container"></div>

    <script type="module">
        import { init } from 'https://unpkg.com/litelight-js@latest/dist/lite-light.min.js';

        // 1. 获取图片清单
        fetch('images/gallery.json')
            .then(response => response.json())
            .then(images => {
                const container = document.getElementById('gallery-container');
                
                // 2. 循环生成图片标签
                images.forEach(name => {
                    const img = document.createElement('img');
                    img.src = `images/thumbnails/${name}`;
                    img.setAttribute('data-lightbox', `images/full/${name}`);
                    img.alt = name;
                    container.appendChild(img);
                });

                // 3. 图片插入 DOM 后，初始化 LiteLight
                init(); 
            })
            .catch(error => console.error('加载图片列表失败:', error));
    </script>
</body>
</html>
