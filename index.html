<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的图片画廊</title>
    <!-- 引入 LiteLight CSS -->
    <link rel="stylesheet" href="https://unpkg.com/litelight-js@latest/dist/lite-light.min.css">
    <style>
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 20px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="gallery">
        <!-- src是缩略图，data-lightbox是大图地址 -->
        <img src="thumbnails/photo1.jpg" 
             data-lightbox="full/photo1.jpg" 
             alt="照片 1">
        <img src="thumbnails/photo2.jpg" 
             data-lightbox="full/photo2.jpg" 
             alt="照片 2">
        <!-- 按此格式继续添加更多图片 -->
    </div>

    <script type="module">
        import { init } from 'https://unpkg.com/litelight-js@latest/dist/lite-light.min.js';
        init(); // 自动查找所有带 data-lightbox 属性的图片
    </script>
</body>
</html>
