<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的图片画廊</title>
    <link rel="stylesheet" href="https://unpkg.com/litelight-js@latest/dist/lite-light.min.css">
    <style>
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 20px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="gallery">
        <img src="images/thumbnails/999c23fe97c34451a2c8740cced127ec_noop.png"
             data-lightbox="images/full/999c23fe97c34451a2c8740cced127ec_noop.png"
             alt="图片 1">
        <img src="images/thumbnails/PFTmjGi1hzpfAC9.jpg"
             data-lightbox="images/full/PFTmjGi1hzpfAC9.jpg"
             alt="图片 2">
    </div>

    <script type="module">
        import { init } from 'https://unpkg.com/litelight-js@latest/dist/lite-light.min.js';
        init();
    </script>
</body>
</html>
