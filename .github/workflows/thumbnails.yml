name: Generate Thumbnails and Gallery

on:
  push:
    branches: [main]
    paths:
      - 'images/full/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate thumbnails
        shell: bash
        run: |
          mkdir -p images/thumbnails
          for img in images/full/*.{jpg,jpeg,png,avif,JPG,JPEG,PNG,AVIF}; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            echo "正在处理缩略图: $filename"
            ext="${filename##*.}"
            name_no_ext="${filename%.*}"
            
            # 核心修改：如果是 avif 格式，缩略图保存为 jpg，确保 100% 兼容
            if [[ "${ext,,}" == "avif" ]]; then
              out_file="${name_no_ext}.jpg"
            else
              out_file="$filename"
            fi
            
            if ! convert "$img" -resize 300x "images/thumbnails/$out_file"; then
              echo "::warning::生成缩略图失败: $filename"
            fi
          done

      - name: Clean up orphan thumbnails
        shell: bash
        run: |
          # 同时清理 jpg, png, avif 后缀的缩略图
          for thumb in images/thumbnails/*.{jpg,jpeg,png,avif,JPG,JPEG,PNG,AVIF}; do
            [ -f "$thumb" ] || continue
            filename=$(basename "$thumb")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            # 检查原图是否存在（考虑 avif 转 jpg 的情况）
            if [ ! -f "images/full/$filename" ] && [ ! -f "images/full/${filename%.*}.avif" ] && [ ! -f "images/full/${filename%.*}.AVIF" ]; then
              echo "清理多余缩略图: $filename"
              rm "$thumb"
            fi
          done

      - name: Generate gallery JSON
        shell: bash
        run: |
          echo "[" > images/gallery.json
          first=true
          for img in images/full/*.{jpg,jpeg,png,avif,JPG,JPEG,PNG,AVIF}; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            # JSON 中记录缩略图的实际文件名（avif 原图对应的是 jpg 缩略图）
            ext="${filename##*.}"
            name_no_ext="${filename%.*}"
            thumb_name="$filename"
            if [[ "${ext,,}" == "avif" ]]; then
              thumb_name="${name_no_ext}.jpg"
            fi
            
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images/gallery.json
            fi
            echo "  \"$thumb_name\"" >> images/gallery.json
          done
          echo "]" >> images/gallery.json

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update thumbnails and gallery list [skip ci]"
          file_pattern: 'images/thumbnails/* images/gallery.json'
