name: Generate Thumbnails and Gallery

on:
  push:
    branches: [main]
    paths:
      - 'images/full/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # 1. 生成缩略图
      - name: Generate thumbnails
        shell: bash
        run: |
          mkdir -p images/thumbnails
          # 匹配常见图片格式（包括大写后缀）
          for img in images/full/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            # 跳过非图片文件（如 readme.md）
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            echo "正在处理缩略图: $filename"
            # 生成固定宽度 300px 的缩略图，保存到 thumbnails 根目录
            convert "$img" -resize 300x "images/thumbnails/$filename"
          done

      # 2. 自动生成 JSON 清单文件
      - name: Generate gallery JSON
        shell: bash
        run: |
          echo "[" > images/gallery.json
          first=true
          for img in images/full/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images/gallery.json
            fi
            echo "  \"$filename\"" >> images/gallery.json
          done
          echo "]" >> images/gallery.json
          echo "生成的 gallery.json 内容如下："
          cat images/gallery.json

      # 3. 提交并推送
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate thumbnails and gallery list [skip ci]"
          file_pattern: 'images/thumbnails/* images/gallery.json'
