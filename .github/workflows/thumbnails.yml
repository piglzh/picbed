name: Generate Thumbnails and Gallery

on:
  push:
    branches: [main]
    paths:
      - 'images/full/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 升级到 v5，消除 Node.js 20 的警告
      - name: Checkout repository
        uses: actions/checkout@v5

      # 安装 ImageMagick 以及 AVIF 解码器插件
      - name: Install ImageMagick and AVIF support
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libheif-examples
          # 解除 ImageMagick 对 AVIF 的安全限制（如果有的话）
          sudo sed -i '/AVIF/d' /etc/ImageMagick-6/policy.xml || true

      # 1. 生成缩略图
      - name: Generate thumbnails
        shell: bash
        run: |
          mkdir -p images/thumbnails
          for img in images/full/*.{jpg,jpeg,png,avif,JPG,JPEG,PNG,AVIF}; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            echo "正在处理缩略图: $filename"
            # 加入容错：如果某张图转换失败，打印警告但继续处理下一张，不中断整个任务
            if ! convert "$img" -resize 300x "images/thumbnails/$filename"; then
              echo "::warning::生成缩略图失败，可能是格式不支持: $filename"
            fi
          done

      # 2. 清理不再需要的“孤儿”缩略图
      - name: Clean up orphan thumbnails
        shell: bash
        run: |
          for thumb in images/thumbnails/*.{jpg,jpeg,png,avif,JPG,JPEG,PNG,AVIF}; do
            [ -f "$thumb" ] || continue
            filename=$(basename "$thumb")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            if [ ! -f "images/full/$filename" ]; then
              echo "原图已被删除，清理多余缩略图: $filename"
              rm "$thumb"
            fi
          done

      # 3. 自动生成 JSON 清单
      - name: Generate gallery JSON
        shell: bash
        run: |
          echo "[" > images/gallery.json
          first=true
          for img in images/full/*.{jpg,jpeg,png,avif,JPG,JPEG,PNG,AVIF}; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images/gallery.json
            fi
            echo "  \"$filename\"" >> images/gallery.json
          done
          echo "]" >> images/gallery.json

      # 4. 提交并推送（升级到 v5）
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update thumbnails and gallery list [skip ci]"
          file_pattern: 'images/thumbnails/* images/gallery.json'
