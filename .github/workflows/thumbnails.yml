name: Generate Thumbnails and Gallery

on:
  push:
    branches: [main]
    paths:
      - 'images/full/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # 1. 生成缩略图
      - name: Generate thumbnails
        shell: bash
        run: |
          mkdir -p images/thumbnails
          for img in images/full/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            echo "正在处理缩略图: $filename"
            convert "$img" -resize 300x "images/thumbnails/$filename"
          done

      # 2. 清理不再需要的“孤儿”缩略图
      - name: Clean up orphan thumbnails
        shell: bash
        run: |
          for thumb in images/thumbnails/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
            [ -f "$thumb" ] || continue
            filename=$(basename "$thumb")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            # 如果原图目录里找不到同名文件，说明原图被删了，清理掉缩略图
            if [ ! -f "images/full/$filename" ]; then
              echo "原图已被删除，清理多余缩略图: $filename"
              rm "$thumb"
            fi
          done

      # 3. 自动生成 JSON 清单文件
      - name: Generate gallery JSON
        shell: bash
        run: |
          echo "[" > images/gallery.json
          first=true
          for img in images/full/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images/gallery.json
            fi
            echo "  \"$filename\"" >> images/gallery.json
          done
          echo "]" >> images/gallery.json

      # 4. 提交并推送
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update thumbnails and gallery list [skip ci]"
          file_pattern: 'images/thumbnails/* images/gallery.json'
