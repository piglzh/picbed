name: Generate Thumbnails and Gallery

on:
  push:
    branches: [main]
    paths:
      - 'images/full/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # 1. 生成缩略图
      - name: Generate thumbnails
        shell: bash
        run: |
          mkdir -p images/thumbnails
          while IFS= read -r -d '' img; do
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            echo "正在处理缩略图: $filename"
            convert "$img" -resize 300x "images/thumbnails/$filename"
          done < <(find images/full -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -print0)

      # 2. 清理不再需要的“孤儿”缩略图
      - name: Clean up orphan thumbnails
        shell: bash
        run: |
          while IFS= read -r -d '' thumb; do
            filename=$(basename "$thumb")
            if [[ "$filename" == *"readme"* ]]; then continue; fi
            
            if [ ! -f "images/full/$filename" ]; then
              echo "原图已被删除，清理多余缩略图: $filename"
              rm "$thumb"
            fi
          done < <(find images/thumbnails -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -print0)

      # 3. 自动生成 JSON 清单文件
      - name: Generate gallery JSON
        shell: bash
        run: |
          echo "=== 调试：images/full 目录内容 ==="
          ls -la images/full
          echo "=== 调试：find 匹配到的图片文件数 ==="
          find images/full -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | wc -l
          echo "=== 调试：find 匹配到的具体文件名 ==="
          find images/full -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \)
          echo "=== 调试：当前 checkout 的 commit ==="
          git log -1 --oneline

          echo "[" > images/gallery.json
          first=true
          while IFS= read -r -d '' img; do
            filename=$(basename "$img")
            if [[ "$filename" == *"readme"* ]]; then continue; fi

            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images/gallery.json
            fi
            echo "  \"$filename\"" >> images/gallery.json
          done < <(find images/full -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -print0 | sort -z)
          echo "]" >> images/gallery.json

      # 4. 提交并推送
          - name: Commit and push changes
            uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update thumbnails and gallery list [skip ci]"
          file_pattern: 'images/thumbnails/* images/gallery.json'
